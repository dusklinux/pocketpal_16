name: Build PocketPal 16 IPA

on:
  schedule:
    # Off-peak non-zero-minute primary weekly slot (Wednesday 11:37 UTC).
    - cron: '37 11 * * 3'
    # Automatic fallback slot (Friday 19:23 UTC); exits in ~15s on Linux if a release tag is < 4 days old.
    - cron: '23 19 * * 5'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish build as a GitHub release'
        required: false
        type: boolean
        default: true
      bump_version:
        description: 'Auto-bump patch version, commit, and tag before building'
        required: false
        type: boolean
        default: true
      update_engine:
        description: 'Auto-rebase onto latest upstream ggml-org/llama.cpp master'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: build-ios16
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RNLLAMA_SKIP_POSTINSTALL: '1'
    outputs:
      should_build: ${{ steps.result.outputs.should_build || 'false' }}
      resolved_commit: ${{ steps.result.outputs.resolved_commit || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Evaluate schedule cooldown, inputs, and upstream llama.cpp SHA
        id: gate
        run: |
          set -euo pipefail
          EVENT="${GITHUB_EVENT_NAME}"

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            PUBLISH="${{ inputs.publish_release }}"
            BUMP="${{ inputs.bump_version }}"
            UPDATE="${{ inputs.update_engine }}"

            if [[ "$PUBLISH" == "true" && "$UPDATE" == "true" && "$BUMP" != "true" ]]; then
              echo "::error::Invalid dispatch inputs: publish_release=true with update_engine=true requires bump_version=true."
              exit 1
            fi
            if [[ "$PUBLISH" == "true" && "$BUMP" == "true" && "${GITHUB_REF_TYPE}" != "branch" ]]; then
              echo "::error::Version bump requires running on a branch ref."
              exit 1
            fi

            if [[ "$UPDATE" == "true" ]]; then
              REMOTE_SHA="$(git ls-remote https://github.com/ggml-org/llama.cpp.git refs/heads/master | awk '{print $1}')"
              [[ -n "$REMOTE_SHA" ]] || { echo "::error::Failed to resolve upstream llama.cpp master SHA."; exit 1; }
              echo "target_commit=${REMOTE_SHA}" >> "$GITHUB_OUTPUT"
            else
              echo "target_commit=" >> "$GITHUB_OUTPUT"
            fi
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT" == "push" ]]; then
            echo "target_commit=" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Scheduled run: enforce 4-day tag cooldown so Friday fallback skips cleanly after a Wednesday release.
          LATEST_TAG_LINE="$(git for-each-ref --count=1 --sort=-creatordate --format='%(creatordate:unix) %(refname:short)' 'refs/tags/v*')"
          if [[ -n "$LATEST_TAG_LINE" ]]; then
            LATEST_TS="$(awk '{print $1}' <<< "$LATEST_TAG_LINE")"
            LATEST_TAG="$(awk '{print $2}' <<< "$LATEST_TAG_LINE")"
            NOW_TS="$(date +%s)"
            AGE_SECS=$(( NOW_TS - LATEST_TS ))
            COOLDOWN_SECS=$(( 4 * 86400 ))
            if (( AGE_SECS < COOLDOWN_SECS )); then
              echo "Latest release tag ${LATEST_TAG} is $(( AGE_SECS / 3600 ))h old (< 96h cooldown). Skipping build."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "target_commit=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          PINNED_COMMIT="$(sed -nE "s/^const commit = '([0-9a-f]{40})';/\1/p" scripts/prepare-backend.cjs)"
          REMOTE_SHA="$(git ls-remote https://github.com/ggml-org/llama.cpp.git refs/heads/master | awk '{print $1}')"
          [[ -n "$PINNED_COMMIT" && -n "$REMOTE_SHA" ]] || {
            echo "::error::Unable to compare pinned commit (${PINNED_COMMIT:-missing}) with upstream master (${REMOTE_SHA:-missing})."
            exit 1
          }

          if [[ "$REMOTE_SHA" == "$PINNED_COMMIT" ]]; then
            echo "Pinned engine already matches upstream master (${PINNED_COMMIT}). Skipping build."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "target_commit=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Upstream llama.cpp advanced: ${PINNED_COMMIT} -> ${REMOTE_SHA}"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "target_commit=${REMOTE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'

      - name: Cache Yarn packages (Linux)
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Rebase llama.cpp engine (preflight)
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.target_commit != ''
        run: bash scripts/rebase-engine.sh "${{ steps.gate.outputs.target_commit }}"

      - name: Install JavaScript dependencies and prepare backend
        if: steps.gate.outputs.proceed == 'true'
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --non-interactive

      - name: Verify prepare-backend idempotency
        if: steps.gate.outputs.proceed == 'true'
        run: node scripts/prepare-backend.cjs

      - name: Run lint, typecheck, and unit tests
        if: steps.gate.outputs.proceed == 'true'
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Emit verified build outputs
        id: result
        if: steps.gate.outputs.proceed == 'true'
        run: |
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "resolved_commit=${{ steps.gate.outputs.target_commit }}" >> "$GITHUB_OUTPUT"

  ios:
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RNLLAMA_SKIP_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.21.0'

      - name: Cache Yarn packages (macOS)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: true

      - name: Replay verified llama.cpp engine rebase
        if: needs.preflight.outputs.resolved_commit != ''
        run: bash scripts/rebase-engine.sh "${{ needs.preflight.outputs.resolved_commit }}"

      - name: Install JavaScript dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --non-interactive

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Bump app version for scheduled or requested release
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.bump_version)
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE}" == "branch" ]] || { echo 'Version bump requires a branch ref.' >&2; exit 1; }
          node <<'NODE'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const oldVersion = pkg.version;
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(oldVersion);
          if (!match) {
            throw new Error(`Unsupported version format in package.json: ${oldVersion}`);
          }

          const existingTags = new Set(
            execFileSync('git', ['tag', '-l', 'v*'], {encoding: 'utf8'})
              .split('\n')
              .map(s => s.trim())
              .filter(Boolean),
          );

          const major = Number(match[1]);
          const minor = Number(match[2]);
          let patch = Number(match[3]) + 1;
          while (existingTags.has(`v${major}.${minor}.${patch}`)) {
            patch += 1;
          }
          const newVersion = `${major}.${minor}.${patch}`;

          pkg.version = newVersion;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const hadNewline =
            !fs.existsSync('.version') ||
            fs.readFileSync('.version', 'utf8').endsWith('\n');
          fs.writeFileSync('.version', newVersion + (hadNewline ? '\n' : ''));

          const updaterPath = 'src/updater.ts';
          const updaterSrc = fs.readFileSync(updaterPath, 'utf8');
          const updatedUpdater = updaterSrc.replace(
            /export const APP_VERSION = '[^']+';/,
            `export const APP_VERSION = '${newVersion}';`,
          );
          if (updaterSrc === updatedUpdater) {
            throw new Error('Failed to update APP_VERSION in src/updater.ts');
          }
          fs.writeFileSync(updaterPath, updatedUpdater);

          for (const iosFile of [
            'ios/PocketPal/Info.plist',
            'ios/PocketPal.xcodeproj/project.pbxproj',
          ]) {
            if (fs.existsSync(iosFile)) {
              const content = fs.readFileSync(iosFile, 'utf8');
              const updated = content
                .replace(
                  /(<key>CFBundleShortVersionString<\/key>\s*<string>)[^<]+(<\/string>)/,
                  `$1${newVersion}$2`,
                )
                .replace(
                  /(MARKETING_VERSION = )[^;]+(;)/g,
                  `$1${newVersion}$2`,
                );
              if (updated !== content) {
                fs.writeFileSync(iosFile, updated);
              }
            }
          }

          console.log(`Bumped version: ${oldVersion} -> ${newVersion}`);
          NODE
          NEW_VERSION=$(node -p "require('./package.json').version")
          ENGINE_SHORT=$(node -p "require('node:fs').readFileSync('src/updater.ts', 'utf8').match(/PINNED_LLAMA_CPP_SHORT\s*=\s*'([^']+)'/)[1]")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .version src/updater.ts scripts/prepare-backend.cjs patches/llama-cpp.patch
          for ios_file in ios/PocketPal/Info.plist ios/PocketPal.xcodeproj/project.pbxproj; do
            [[ -f "$ios_file" ]] && git add "$ios_file"
          done
          git commit -m "chore(release): v${NEW_VERSION} (llama.cpp ${ENGINE_SHORT})"
          git tag "v${NEW_VERSION}"

      - name: Log macOS and Xcode toolchain versions
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version

      - name: Build device IPA
        env:
          SKIP_JS_CHECKS: '1'
        run: |
          if ! bash scripts/build-ios.sh; then
            echo "::error::Build script failed. Dumping compiler and linker diagnostics from build/ios-build.log:"
            if [[ -f build/ios-build.log ]]; then
              echo "=== First Compiler/Linker Errors ==="
              grep -n -C 6 -E "(error:|fatal error:|Undefined symbols|ld: symbol|BUILD FAILED)" build/ios-build.log | head -n 120 || true
              echo "=== Last Compiler/Linker Errors ==="
              grep -n -C 6 -E "(error:|fatal error:|Undefined symbols|ld: symbol|BUILD FAILED)" build/ios-build.log | tail -n 120 || true
            fi
            exit 1
          fi

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PocketPal16
          path: build/PocketPal16.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ios-build-log
          path: build/ios-build.log
          if-no-files-found: ignore

      - name: Publish Release IPA
        if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP_VERSION: ${{ inputs.bump_version }}
        run: |
          set -euo pipefail
          VERSION_TAG="v$(node -p "require('./package.json').version")"
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != tag ]]; then
            TAG_NAME="$VERSION_TAG"
          fi
          [[ "$TAG_NAME" == "$VERSION_TAG" ]] || { echo 'Tag and app version differ.' >&2; exit 1; }
          if [[ -f .version ]]; then
            [[ "$(tr -d '[:space:]' < .version)" == "${VERSION_TAG#v}" ]] || { echo '.version and package version differ.' >&2; exit 1; }
          fi
          NATIVE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/DerivedData/Build/Products/Release-iphoneos/PocketPal.app/Info.plist)
          [[ "$NATIVE_VERSION" == "${VERSION_TAG#v}" ]] || { echo 'Native bundle and package version differ.' >&2; exit 1; }
          [[ "$(node -p "require('node:fs').readFileSync('src/updater.ts', 'utf8').match(/APP_VERSION = '([^']+)'/)[1]")" == "${VERSION_TAG#v}" ]] || { echo 'Updater and app version differ.' >&2; exit 1; }

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${BUMP_VERSION:-false}" == "true" ]]; then
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
            git push origin "$TAG_NAME"
          fi

          TARGET_SHA=$(git rev-parse HEAD)
          ENGINE_COMMIT=$(node -p "require('node:fs').readFileSync('scripts/prepare-backend.cjs', 'utf8').match(/const commit = '([^']+)'/)[1]")
          # A new native build needs a new version. Never replace an existing IPA:
          # clients comparing versions would otherwise miss the changed engine.
          gh release create "$TAG_NAME" build/PocketPal16.ipa \
            --target "$TARGET_SHA" --title "PocketPal 16 $TAG_NAME" \
            --notes "Full native iOS 16 build from $TARGET_SHA. Engine: $ENGINE_COMMIT. Install with TrollStore Lite on a jailbroken device."
